<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптека Аннесбурга</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050e17;--card:rgba(15,38,55,.9);--bd:rgba(130,200,225,.12);--tx:#eaf3f7;--mu:#8ea6b5;--ac:#f7b733;--ac2:#e39a0c;--gold:#f7b733;--tl:#2fd9bb;--ok:#4ade80;--er:#fb7185;--wr:#fbbf24;--r:18px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.5 "Onest","Segoe UI",system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -5%,rgba(20,90,110,.35),transparent 60%),linear-gradient(170deg,#081826,#050e17 60%,#06141b);overflow-x:hidden}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
#app,#login{position:relative;z-index:2}
#decor{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;contain:strict}
.orb{position:fixed;width:620px;height:620px;border-radius:50%;pointer-events:none;z-index:0;animation:drift 22s ease-in-out infinite;will-change:transform}
.o1{background:radial-gradient(circle,rgba(47,217,187,.16),transparent 65%);top:-220px;left:-180px}
.o2{background:radial-gradient(circle,rgba(247,183,51,.11),transparent 65%);bottom:-260px;right:-180px;animation-delay:-11s}
#app{display:flex;min-height:100%}
nav{width:232px;background:linear-gradient(180deg,#0b2234,#08192a);border-right:1px solid var(--bd);padding:14px 10px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;display:flex;flex-direction:column}
nav .brand{display:flex;align-items:center;gap:10px;font-family:"Playfair Display",serif;font-size:17px;padding:2px 10px 12px;color:var(--ac)}
nav .brand svg{width:24px;color:var(--tl)}
.ng{font-size:10.5px;letter-spacing:1.2px;color:#7f98a8;padding:12px 10px 4px;font-weight:700}
nav a{position:relative;display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:12px;color:#d3e2ea;cursor:pointer;margin-bottom:3px;border:2px solid transparent;font-size:13.5px;transition:background .2s,transform .2s}
nav a i{font-style:normal;font-size:17px;width:22px;text-align:center}
nav a:hover{background:rgba(255,255,255,.05);transform:translateX(3px)}
nav a.on{color:var(--ac);border-color:var(--ac);background:linear-gradient(90deg,rgba(247,183,51,.12),rgba(247,183,51,.02));box-shadow:0 0 18px rgba(247,183,51,.22)}
nav a.on::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.usr{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;font-size:13px;border-radius:50%;background:linear-gradient(135deg,#ffd366,#e39a0c);color:#2a1a00;font-weight:800;display:grid;place-items:center;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.un{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.un b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un span{font-size:11px;color:var(--mu)}
.lo{background:none;border:0;color:var(--mu);cursor:pointer;padding:6px;border-radius:10px}
.lo:hover{color:var(--ac);background:rgba(255,255,255,.06)}
.lo svg{width:20px;display:block}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#hd{height:52px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--bd);background:rgba(6,16,25,.85);font-size:15px;position:sticky;top:0;z-index:5}
#hd span{font-size:18px}
main{flex:1;padding:18px 24px}
main.fx{animation:rise .3s both}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top>div{display:flex;gap:8px;flex-wrap:wrap}
#view>.top{justify-content:flex-end}
#view>.top h2{display:none}
h2{font-size:19px;color:#f3fbf9}
.meta{color:var(--mu);font-size:12px}

.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffd366,#f2a516);color:#2a1a00;border:0;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px -10px rgba(247,183,51,.8);transition:transform .15s,filter .15s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-120%)}
.btn:hover::after{transform:translateX(120%);transition:transform .6s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.big{padding:10px 20px;font-size:14px}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--bd);padding:6px 11px;font-size:12px;font-weight:600;box-shadow:none}
.pill{background:rgba(47,217,187,.1);color:var(--tl);border:1px solid rgba(47,217,187,.3);border-radius:99px;padding:5px 15px;cursor:pointer;font-size:12px}
.pill:hover{background:rgba(47,217,187,.2)}
input,textarea,select{background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;width:100%;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
select option,select optgroup{background:#0d2133;color:#eaf3f7}
textarea{resize:vertical}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px;transition:transform .2s,border-color .2s,box-shadow .2s}
.grid>.card:hover,.sc:hover{border-color:rgba(247,183,51,.55);box-shadow:0 0 22px rgba(247,183,51,.15);transform:translateY(-3px)}
#login{min-height:100%;display:grid;place-items:center;padding:20px;overflow:hidden}
.scene{position:absolute;left:0;right:0;bottom:0;color:var(--tl);opacity:.24;pointer-events:none}
.scene svg{width:100%;display:block;overflow:visible}
.scene g>*{animation:sway var(--d,7s) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.scene g>:nth-child(3n){--d:8.5s;animation-delay:-2s}
.scene g>:nth-child(3n+1){--d:6.5s;animation-delay:-4s}
.scene g>:nth-child(4n){animation-direction:reverse}
.lbox{position:relative;width:min(370px,100%);padding:26px;animation:rise .5s both;z-index:2}
.logo{width:60px;height:60px;margin:0 auto 8px;color:var(--tl);animation:bob 5s ease-in-out infinite}
h1{font-size:24px;text-align:center;color:var(--ac)}
.sub{text-align:center;color:var(--mu);margin-bottom:10px;font-size:12px}
.err{color:var(--er);min-height:20px;margin-top:8px;font-size:13px}
.spin{width:15px;height:15px;border:2px solid rgba(42,26,0,.3);border-top-color:#2a1a00;border-radius:50%;display:inline-block;vertical-align:-3px;animation:rot .7s linear infinite;margin-right:6px}
.ld{position:relative;width:64px;height:64px;margin:18px auto;color:var(--tl)}
.ld svg{width:100%;animation:bob 1.6s ease-in-out infinite}
.ld i{position:absolute;bottom:8px;left:28px;width:7px;height:7px;border-radius:50%;background:var(--tl);opacity:0;animation:bub 1.6s ease-in infinite}
.ld i:nth-of-type(2){left:34px;animation-delay:.5s}.ld i:nth-of-type(3){left:24px;animation-delay:1s}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:13px;margin-bottom:16px}
.sc{display:flex;flex-direction:column;gap:5px;animation:rise .45s both}
.sc:nth-child(2){animation-delay:.04s}.sc:nth-child(3){animation-delay:.08s}.sc:nth-child(4){animation-delay:.12s}.sc:nth-child(n+5){animation-delay:.16s}
.sh{display:flex;justify-content:space-between;align-items:center;color:#c4d6df}
.ci{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:18px;font-style:normal}
.sc b{font-size:26px;font-weight:800;line-height:1.1}
.sc b.ok{color:var(--ok)}.sc b.wr{color:var(--wr)}.sc b.er{color:var(--er)}
.sc small{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch h3{font-size:16px}
.chart{width:100%;display:block}
.chart line{stroke:rgba(255,255,255,.08)}
.chart text{fill:#8ea6b5;font-size:10px}
.chart .wd{font-weight:700;fill:#c4d6df}
.chart .bv{fill:var(--ac);font-weight:700}
.chart .nd{font-size:12px}
.chart .bb{fill:url(#bg);transform-box:fill-box;transform-origin:bottom;animation:growY .8s both}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.rw:last-child{border:0}
.rw b{display:block;font-size:12.5px}
.rw small{color:var(--mu);font-size:12px}
.rv{color:var(--ac);font-weight:800;white-space:nowrap}
.rv.er{color:var(--er)}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools input{max-width:340px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.grid>*{animation:rise .4s both}
.grid>:nth-child(2){animation-delay:.05s}.grid>:nth-child(3){animation-delay:.1s}.grid>:nth-child(4){animation-delay:.15s}.grid>:nth-child(n+5){animation-delay:.2s}
.rc{content-visibility:auto;contain-intrinsic-size:auto 340px;display:flex;flex-direction:column;gap:6px}
.rc h3{font-size:15px}
.chips,.seg,.mul{display:flex;gap:8px;flex-wrap:wrap}
.chips{margin-bottom:14px}
.chip,.seg button,.mul button,.pl button{padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--bd);cursor:pointer;font-size:12.5px;transition:background .15s,border-color .15s,transform .15s}
.chip:hover,.seg button:hover,.mul button:hover,.pl button:hover{border-color:var(--ac);transform:translateY(-2px)}
.chip.on,.seg button.on,.mul button.on,.pl button.on{background:linear-gradient(135deg,#ffd366,#f2a516);color:#2a1a00;border-color:transparent;font-weight:700}
.pk .srch{margin:6px 0}
.pl{max-height:190px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pl button[hidden]{display:none}
.pnl{margin-bottom:16px;border-color:rgba(247,183,51,.5);animation:rise .25s both}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acts{display:flex;gap:8px;margin-top:14px}
.stp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stp input{width:110px;text-align:center}
.ph{height:78px;border-radius:13px;background:radial-gradient(circle at 30% 20%,hsl(var(--h) 55% 28%),hsl(var(--h) 55% 11%));color:hsl(var(--h) 80% 70%);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:4px}
.ph svg{width:44px;animation:bob 4s ease-in-out infinite}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ing{display:flex;justify-content:space-between;font-size:12.5px;padding:1px 0}
.ing.bad,td.bad,.lowq{color:var(--er)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(251,191,36,.15);color:var(--wr);align-self:flex-start}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
tr:hover td{background:rgba(255,255,255,.03)}
tr[hidden]{display:none}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.warn{background:rgba(251,113,133,.12);color:var(--er);padding:8px 12px;border-radius:10px;margin:10px 0;font-size:12.5px}
.note,.banner{background:rgba(247,183,51,.09);border:1px solid rgba(247,183,51,.3);color:var(--ac);padding:10px 14px;border-radius:13px;margin-bottom:14px;font-size:12.5px}
.bar{display:block;height:8px;background:rgba(0,0,0,.35);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--ac));border-radius:9px;animation:grow 1s both;transform-origin:left}
.list div{padding:8px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.sk{height:14px;border-radius:8px;background:rgba(255,255,255,.07);margin:10px 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.t{padding:10px 16px;border-radius:13px;background:#0d2133;border:1px solid var(--bd);animation:rise .25s both}
.t.ok{border-color:var(--ok)}.t.ok::before{content:"✓ ";color:var(--ok)}
.t.er{border-color:var(--er)}.t.er::before{content:"✕ ";color:var(--er)}
.cel{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:90;background:#112a3a;border:1px solid var(--ac);padding:10px 22px;border-radius:99px;display:flex;gap:10px;align-items:center;animation:pop .35s both}
.cel svg{width:26px;color:var(--ac)}
.shake{animation:shake .4s}
.dc{position:absolute;color:var(--tl);will-change:transform;filter:drop-shadow(0 0 8px rgba(47,217,187,.35));animation:float var(--d) ease-in-out infinite;animation-delay:var(--l)}
.dc svg{width:100%;height:100%;display:block}
.st{position:absolute;font-size:var(--s);color:var(--ac);opacity:.15;font-style:normal;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--l)}
.st::before{content:"✦"}
.pt{position:absolute;bottom:-14px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.9),rgba(255,214,120,0) 70%);opacity:0;will-change:transform;animation:pt var(--d) linear infinite;animation-delay:var(--l)}
#mt{position:fixed;left:14px;bottom:14px;z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:rgba(10,24,36,.95);cursor:pointer;font-size:17px;transition:transform .2s}
#mt:hover{transform:scale(1.1);border-color:var(--ac)}
.lite #decor,.lite .orb{display:none}
.pz #decor *,.pz .orb{animation-play-state:paused}

.sc b{font-family:"Onest",sans-serif;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sc b.er,.er{color:var(--er)}.sc b.gd{color:var(--ac)}.sc b.ok{color:var(--ok)}
.rw b.ok,b.ok{color:var(--ok)}
.bdg{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:#c4d6df;white-space:nowrap}
.bdg.ok{background:rgba(74,222,128,.14);color:var(--ok)}.bdg.wr{background:rgba(251,191,36,.14);color:var(--wr)}.bdg.er{background:rgba(251,113,133,.14);color:var(--er)}.bdg.tl{background:rgba(47,217,187,.14);color:var(--tl)}.bdg.gd{background:rgba(247,183,51,.16);color:var(--ac)}.bdg.mu{color:var(--mu)}
.gd{color:var(--ac)}
.ra{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
td .ra{margin:0}
code{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:7px;font-size:12px;color:var(--tl)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-left:8px}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;margin:10px 0;color:var(--tx);font-size:13px}
.sw input{display:none}
.sw i{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex-shrink:0}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i::after{transform:translateX(18px);background:#2a1a00}
input[type=range]{padding:0;accent-color:var(--ac)}
.hero2{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px 0 18px;flex-wrap:wrap}
.wel{font-size:28px;line-height:1.15;color:var(--ac);text-shadow:0 0 26px rgba(247,183,51,.25);text-align:left}
.wv{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
.hart{display:flex;gap:14px;color:var(--tl);opacity:.7}
.hart svg{width:44px;animation:bob 4s ease-in-out infinite}.hart svg:nth-child(2){animation-delay:-1.3s;color:var(--ac)}.hart svg:nth-child(3){animation-delay:-2.6s}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:200px}
.pp{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;width:30%;animation:rise .6s both}
.pp i{display:block;width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(247,183,51,.45),rgba(247,183,51,.06));margin-top:8px;transform-origin:bottom;animation:growY .8s both}
.pp span{font-size:26px}.pp b{font-size:13px}.pp small{color:var(--mu)}
.hbr{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:7px 0}
.hbr .bar{margin:0}
.pf{display:flex;gap:24px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.av.lg{width:80px;height:80px;font-size:28px}
.empty{text-align:center;color:var(--mu);padding:30px}
.orow{display:grid;grid-template-columns:1fr 80px 100px auto;gap:8px;margin-bottom:8px;align-items:center}
.pr{text-align:right}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.9}100%{transform:translateY(-34px) scale(1);opacity:0}}
@keyframes drift{50%{transform:translate3d(50px,-34px,0) scale(1.08)}}
@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(var(--r0))}33%{transform:translate3d(18px,-26px,0) rotate(calc(var(--r0) + 12deg))}66%{transform:translate3d(-14px,-12px,0) rotate(calc(var(--r0) - 8deg))}}
@keyframes pt{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:var(--o)}100%{transform:translate3d(var(--dx),-115vh,0);opacity:0}}
@keyframes tw{50%{opacity:.65}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

@media(max-width:1000px){.two{grid-template-columns:1fr}}
@media(max-width:860px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;gap:4px}nav .brand,.ng{display:none}#nl{display:flex;gap:4px}nav a{white-space:nowrap;padding:7px 10px;font-size:13px}nav a.on::before{display:none}.usr{margin:0 0 0 auto;border:0;padding:0}.un{display:none}#hd{padding:0 16px;height:48px}main{padding:14px}.wel{font-size:22px}.orow{grid-template-columns:1fr 70px 80px auto}}
</style>
</head>
<body>
<section id="login">
  <div class="scene" id="scn"></div>
  <div class="card lbox">
    <div class="logo" id="lgo"></div>
    <h1>Аптека Аннесбурга</h1>
    <p class="sub">Вхід до системи управління</p>
    <label for="lg">Логін</label><input id="lg" autocomplete="username">
    <label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="lbtn" style="width:100%;margin-top:16px">Увійти</button>
    <button class="btn ghost hide" id="prev" style="width:100%;margin-top:8px">Переглянути інтерфейс без сервера</button>
    <div class="err" id="lerr"></div>
  </div>
</section>
<div id="app" class="hide">
  <nav id="nav"><div class="brand"></div><div id="nl"></div><div class="usr" id="usr"></div></nav>
  <div id="wrap"><header id="hd"></header><main id="view"></main></div>
</div>
<div id="toast"></div>
<script>

async function api(action,data={}){
  if(!CONFIG.API_URL)throw new Error("Сервер не підключено (CONFIG.API_URL порожній)");
  S.busy=(S.busy||0)+1;
  try{
    const body=JSON.stringify({action,token:S.token,requestId:crypto.randomUUID(),data});let j,err;
    for(let i=0;i<3;i++){
      try{const r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});j=await r.json();err=null;break}
      catch(e){err=e;await new Promise(r=>setTimeout(r,400*(i+1)))}
    }
    if(err)throw new Error("Немає зв'язку із сервером. Спробуйте ще раз.");
    if(!j.ok){if(j.code==="SESSION_ENDED")return endSession(j.message);throw new Error(j.error||"Помилка сервера")}
    return j.data;
  }finally{S.busy--}
}

function fld(f){

  return`<label>${f.l}</label>`+(f.t==="area"?`<textarea name="${f.k}" rows="4">${esc(f.v??"")}</textarea>`:`<input name="${f.k}" type="${f.t||"text"}" value="${esc(f.v??"")}">`);
}
function form(title,fields,done){

  m.onclick=e=>{
    const mu=e.target.closest(".mul button");if(mu){mu.classList.toggle("on");const h=mu.closest(".mul");h.querySelector("input").value=[...h.querySelectorAll("button.on")].map(b=>b.dataset.v).join(",");return}

  const sb=$("#fs",m);

    m.querySelectorAll("[name]").forEach(e=>{d[e.name]=e.type==="number"?+e.value:e.value;if(e.type==="hidden"&&e.closest(".pk")&&!e.value)bad=true});

}

/* генеративна ембієнт-музика (Web Audio) */
const AU={on:false,vol:.3,sfx:true};
try{Object.assign(AU,JSON.parse(localStorage.getItem("au")||"{}"))}catch(e){}
let actx=null,mus=null;
const auSave=()=>{try{localStorage.setItem("au",JSON.stringify(AU))}catch(e){}};
function music(){
  if(!AU.on){if(mus){clearInterval(mus.t);mus.g.gain.setTargetAtTime(0,actx.currentTime,.4);mus=null}syncBtn();return}
  if(mus){mus.g.gain.value=AU.vol*.25;return}
  actx=actx||new AudioContext();actx.resume();
  const g=actx.createGain();g.gain.value=AU.vol*.25;g.connect(actx.destination);
  const ch=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]];let i=0;
  const note=(f,d,v,at=0)=>{const o=actx.createOscillator(),e=actx.createGain(),t=actx.currentTime+at;o.type="sine";o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+d*.4);e.gain.linearRampToValueAtTime(0,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d)};
  const bar=()=>{const c=ch[i++%4];c.forEach(f=>{note(f,9,.3);note(f/2,9,.18)});for(let k=0;k<4;k++)note(c[Math.floor(Math.random()*3)]*2,3,.1,k*2+Math.random())};
  bar();mus={g,t:setInterval(bar,8000)};syncBtn();
}
function sfx(t){if(!AU.sfx)return;try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;o.type="triangle";o.frequency.setValueAtTime({er:190,sys:330,done:520}[t]||440,n);if(t==="done")o.frequency.linearRampToValueAtTime(1040,n+.3);if(t==="sys")o.frequency.linearRampToValueAtTime(220,n+.3);if(t==="er")o.frequency.linearRampToValueAtTime(120,n+.25);g.gain.setValueAtTime(Math.min(.06,AU.vol/5),n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(g);g.connect(actx.destination);o.start();o.stop(n+.3)}catch(e){}}
function syncBtn(){const b=document.getElementById("mt");if(b)b.textContent=AU.on?"🎵":"🔇"}
(function(){const b=document.createElement("button");b.id="mt";b.title="Музика";b.onclick=()=>{AU.on=!AU.on;auSave();music()};document.body.append(b);syncBtn();
  document.addEventListener("click",()=>{if(AU.on&&!mus)music()},{once:true})})();

/* ===== КРАФТ: блокування за вмінням, ліміт за ресурсами та місткістю складу ===== */
const mySk=()=>S.preview?99:(+S.user?.skill||1);
const lockR=r=>!r.na&&r.skill>mySk();
const totalNow=()=>S.total??Object.values(S.inv).reduce((a,b)=>a+b,0);
const maxCy=r=>{if(r.na||lockR(r))return 0;
  const m=Math.min(...Object.entries(r.ing).map(([n,q])=>Math.floor(stock(n)/q)));
  return Math.max(0,m)};
let craftCat=0,craftQ="",craftOnly=false;
VIEWS.craft=async v=>{
  const t=S.cur;v.onclick=null;
  v.innerHTML=`<div class="top"><h2>Крафт</h2></div>${noSrv()}<div class="tools"><input id="cq" placeholder="🔍 Пошук рецепта…" value="${esc(craftQ)}"><span class="chip ${craftOnly?"on":""}" id="co">✅ Можна створити</span></div><div class="chips" id="cc"></div><div class="grid" id="rg">${SK}</div>`;
  await ready();if(t!==S.cur)return;
  const can=r=>maxCy(r)>0;
  const card=r=>{
    if(r.na)return`<div class="card rc">${ph(r)}<h3>${esc(r.name)}</h3><span class="tag">Наразі недоступний</span><button class="btn" disabled>Створити</button></div>`;
    if(lockR(r))return`<div class="card rc" style="opacity:.7">${ph(r)}<h3>${esc(r.name)}</h3><div class="meta">Вміння: ${r.skill} · ${fmtT(r.time)} · вихід: ${r.yield}</div><span class="tag">🔒 Потрібне вміння ${r.skill} (у вас ${mySk()})</span><button class="btn" disabled>Заблоковано</button></div>`;
    const m=maxCy(r);
    return`<div class="card rc">${ph(r)}<h3>${esc(r.name)}</h3><div class="meta">Вміння: ${r.skill} · ${fmtT(r.time)} · вихід: ${r.yield} · на складі: <b>${stock(r.name)}</b></div>
    ${Object.entries(r.ing).map(([n,q])=>`<div class="ing ${stock(n)<q?"bad":""}"><span>${esc(n)}</span><span>${stock(n)} / ${q}</span></div>`).join("")}
    <div class="meta">${m>0?"✅ Можна зробити циклів: <b>"+m+"</b>":"⛔ Не вистачає ресурсів"}</div><button class="btn" data-r="${r.id}" ${m>0?"":"disabled"}>Створити</button></div>`};
  const draw=()=>{const q=craftQ.trim().toLowerCase();
    $("#cc").innerHTML=CATS.map((c,i)=>`<span class="chip ${!q&&i===craftCat?"on":""}" data-i="${i}">${ICON[i]} ${c}</span>`).join("");
    const l=RECIPES.filter(r=>(q?r.name.toLowerCase().includes(q):r.cat===craftCat)&&(!craftOnly||can(r)));
    $("#rg").innerHTML=l.map(card).join("")||'<p class="meta">Нічого не знайдено</p>'};
  draw();
  $("#cq").oninput=e=>{craftQ=e.target.value;draw()};
  $("#co").onclick=e=>{craftOnly=!craftOnly;e.target.classList.toggle("on",craftOnly);draw()};
  $("#cc").onclick=e=>{const i=e.target.closest("[data-i]")?.dataset.i;if(i!=null){craftCat=+i;craftQ="";$("#cq").value="";draw()}};
  $("#rg").onclick=e=>{const id=e.target.closest("[data-r]")?.dataset.r;if(id)craftPanel(RECIPES.find(r=>r.id===id))};
};
function craftPanel(r){
  if(lockR(r))return toast("Недостатньо вміння: потрібно "+r.skill+", у вас "+mySk(),"er");
  const m=pnl(`<div class="ph2"><h3>${ICON[r.cat]} ${esc(r.name)}</h3><button class="btn ghost x">✕</button></div><label>Кількість виробничих циклів</label><div class="stp"><button class="btn ghost" data-d="-1">−</button><input id="cy" type="number" min="1" value="1"><button class="btn ghost" data-d="1">+</button><button class="btn ghost" data-d="10">+10</button><button class="btn ghost" id="mx">Макс.</button></div><div id="sm"></div><div class="acts"><button class="btn" id="ok">Підтвердити крафт</button><button class="btn ghost x">Скасувати</button></div>`);
  m.querySelectorAll(".x").forEach(b=>b.onclick=()=>m.remove());
  const total=totalNow;
  const calc=()=>{
    const c=Math.max(1,parseInt($("#cy").value)||1),ins=Object.entries(r.ing).map(([n,q])=>[n,q*c,stock(n)]);
    const used=ins.reduce((a,x)=>a+x[1],0),out=r.yield*c,fin=total()-used+out,w=[];
    if(lockR(r))w.push("Недостатньо вміння: потрібно "+r.skill+", у вас "+mySk());
    ins.forEach(([n,q,s])=>{if(s<q)w.push(`Не вистачає: ${n} (${q-s})`)});
    if(!CONFIG.API_URL)w.push("Сервер не підключено");
    let cost=0,unk=0;ins.forEach(([n,q])=>{const p=S.prices[n];if(p==null)unk++;else cost+=p*q});
    const pp=S.prices[r.name],rev=pp==null?null:pp*out,pf=rev==null?null:rev-cost;
    $("#sm").innerHTML=`<p class="meta">Час: ${fmtT(r.time*c)} · Продукції на склад: <b>${out}</b></p><div style="overflow-x:auto"><table><tr><th>Інгредієнт</th><th>Списати</th><th>Є</th><th>Залишиться</th><th>Ціна/од. $</th><th>Вартість</th></tr>${ins.map(([n,q,s])=>`<tr><td>${esc(n)}</td><td>${q}</td><td class="${s<q?"bad":""}">${s}</td><td>${s-q}</td><td>${pin(n,S.prices[n],80)}</td><td>${S.prices[n]==null?"—":money(S.prices[n]*q)}</td></tr>`).join("")}</table></div><p class="meta">Склад після операції: ${fin}</p>
    <div class="rw"><span>Витрати на матеріали${unk?` <small>(без ${unk} поз. — ціну не вказано)</small>`:""}</span><b class="er">${money(cost)}</b></div>
    <div class="rw"><span>Ціна продажу «${esc(r.name)}» за од.</span>${pin(r.name,pp)}</div>
    <div class="rw"><span>Очікувана виручка (${out} од.)</span><b class="gd">${rev==null?"—":money(rev)}</b></div>
    <div class="rw"><span>Очікуваний прибуток</span><b class="${pf==null?"":pf>=0?"ok":"er"}">${pf==null?"—":money(pf)}</b></div>${w.map(x=>`<div class="warn">${esc(x)}</div>`).join("")}`;
    $("#ok").disabled=w.length>0;return{c,used,out}};
  m.onchange=async e=>{const i=e.target.closest(".pr");if(i&&await setPrice(i.dataset.n,i.value)){calc();toast("Ціну збережено")}};
  $("#cy").oninput=calc;calc();
  $("#mx").onclick=()=>{$("#cy").value=Math.max(1,maxCy(r));calc()};
  $("#ok").onclick=async()=>{const{c,used,out}=calc(),b=$("#ok");b.disabled=true;b.innerHTML='<span class="spin"></span>Виконується';
    try{await api("craft",{recipeId:r.id,cycles:c});
      const nt=total()-used+out;Object.entries(r.ing).forEach(([n,q])=>S.inv[n]=(S.inv[n]||0)-q*c);S.inv[r.name]=(S.inv[r.name]||0)+out;S.total=nt;
      m.remove();toast("Крафт завершено ✅");celebrate(r.name);sfx("done");go("craft");S.bp=loadRef()}
    catch(e){toast(e.message,"er");b.disabled=false;b.textContent="Підтвердити крафт"}};
}

VIEWS.calc=async v=>{
  const t=S.cur;v.onclick=null;let cat=0,rid=null;
  v.innerHTML=`<div class="top"><h2>Підрахунок</h2></div>${noSrv()}<div class="card"><label>Категорія</label><div class="chips" id="kc"></div><label>Рецепт</label><div class="chips" id="kr"></div><label>Потрібна кількість готової продукції</label><div class="stp"><button class="btn ghost" data-d="-10">−10</button><input id="kq" type="number" min="1" value="100"><button class="btn ghost" data-d="10">+10</button><button class="btn ghost" data-d="100">+100</button></div></div><div id="ko" style="margin-top:14px"></div>`;
  await ready();if(t!==S.cur)return;
  const run=()=>{
    const r=RECIPES.find(x=>x.id===rid),q=Math.max(1,parseInt($("#kq").value)||1);
    if(!r){$("#ko").innerHTML="";return}
    const cy=Math.ceil(q/r.yield),out=cy*r.yield;let full=0,cost=0,unk=0;
    const rows=Object.entries(r.ing).map(([n,per])=>{const need=per*cy,have=stock(n),def=Math.max(0,need-have),p=S.prices[n];
      if(p==null)unk++;else{full+=need*p;cost+=def*p}

/* запасні рецепти (лише для схеми, якщо їх ще немає в базі); 5 хв = 300 с */
const EXTRA=[
 {name:"Порожній шприц",cat:7,skill:1,time:300,yield:100,ing:{"Пісок":100,"Залізний злиток":3}},
 {name:"Порожній флакон",cat:7,skill:1,time:300,yield:100,ing:{"Пісок":50,"Корок":25}},
 {name:"Порожня банка",cat:7,skill:1,time:300,yield:50,ing:{"Пісок":100,"Корок":50}}];
const REC=()=>[...RECIPES.filter(r=>!r.na&&r.ing),...EXTRA.filter(e=>!RECIPES.some(r=>r.name===e.name))];
let SCH={cat:0,q:""},ITEMS={};

function calc(name,qty){
  const rm=Object.fromEntries(REC().map(r=>[r.name,r])),L={};
  const lv=n=>L[n]??(L[n]=0,L[n]=rm[n]?1+Math.max(0,...Object.keys(rm[n].ing).map(lv)):0);lv(name);
  const order=Object.keys(L).sort((a,b)=>L[b]-L[a]),need={[name]:qty},cy={};
  order.forEach(n=>{const r=rm[n];if(!r)return;cy[n]=Math.ceil(need[n]/r.yield);Object.entries(r.ing).forEach(([i,p])=>need[i]=(need[i]||0)+cy[n]*p)});
  const U={},uc=(n,g=[])=>{if(n in U)return U[n];const r=rm[n];if(!r||g.includes(n))return U[n]=+S.prices[n]||0;
    return U[n]=Object.entries(r.ing).reduce((a,[i,p])=>a+p*uc(i,[...g,n]),0)/r.yield};
  return{rm,L,need,cy,uc,order};
}

function openSchema(name,after){
  const o=document.createElement("div");o.className="sov";
  o.innerHTML=`<div class="soh"><h3>🧬 Схема: ${esc(name)}</h3><span class="meta">Порції:</span><div class="stp"><button class="btn ghost" data-d="-1">−</button><input id="oq" type="number" min="1" value="1"><button class="btn ghost" data-d="1">+</button><button class="btn ghost" data-d="10">+10</button></div><button class="btn ghost" id="cpa">📋 Копіювати всі етапи</button><button class="btn ghost" id="cl">✕</button></div><div class="sob" id="sob"></div>`;
  document.body.append(o);
  let q=1,ex=new Set(),G=null;
  const close=()=>{o.remove();document.removeEventListener("keydown",esc_);if(after)after()},esc_=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",esc_);
  const cp=s=>navigator.clipboard.writeText(s).then(()=>toast("Скопійовано")).catch(()=>toast("Не вдалося скопіювати","er"));
  const render=()=>{
    const{rm,L,need,cy,uc,order}=calc(name,q*rm0().yield);G={rm,need,cy,order};
    const r=rm[name],out=cy[name]*r.yield;let raw=0,unk=0,time=0;
    order.forEach(n=>{if(rm[n])time+=cy[n]*rm[n].time;else if(S.prices[n]==null)unk++;else raw+=S.prices[n]*need[n]});
    const mx=L[name],cols=[...Array(mx+1)].map((_,k)=>order.filter(n=>L[n]===k));
    const card=n=>{const x=rm[n],p=S.prices[n],s=stock(n),nt=ITEMS[n]?.note,op=ex.has(n);
      return`<div class="sk2 ${x?(n===name?"fin":"mid"):"rw0"}" data-k="${esc(n)}"><div class="sk2h"><b>${esc(n)}</b>${bdg(x?"рецепт":"сировина",x?"gd":"tl")}</div><div class="sk2q">× ${need[n]}${x&&n!==name?` <small class="meta">база ${x.yield}</small>`:""}</div>
      <div class="meta">На складі: <b class="${s<need[n]?"er":"ok"}">${s}</b> · ≈ <b class="gd">${money(need[n]*uc(n))}</b></div>${op?"":'<small class="meta">клік — розгорнути</small>'}
      ${op?`<div class="sk2d">${x?`<div class="meta">${cy[n]} цикл. × ${x.yield} шт · ${fmtT(cy[n]*x.time)}</div>${Object.entries(x.ing).map(([a,pp])=>`<div class="ing"><span>${esc(a)}</span><span>×${pp*cy[n]} · ${money(uc(a))}</span></div>`).join("")}<div class="rw"><span>Собівартість/од.</span><b class="gd">${money(uc(n))}</b></div>`:`<div class="rw"><span>Ціна/од. $</span>${pin(n,p,84)}</div>`}
      ${nt?`<div class="sk2n">📍 ${esc(nt)}</div>`:""}${isAdmin()&&ITEMS[n]?`<textarea class="nt" rows="2" placeholder="Де брати / опис">${esc(nt||"")}</textarea><div class="ra"><button class="btn ghost" data-sn="${esc(n)}">💾 Зберегти опис</button></div>`:""}
      <div class="ra"><button class="btn ghost" data-cp="${esc(n)}">Копіювати</button>${x?`<button class="btn ghost" data-cr="${esc(n)}">У крафт →</button>`:""}</div></div>`:""}</div>`};
    const tot=order.filter(n=>!rm[n]&&S.prices[n]!=null).map(n=>[n,S.prices[n]*need[n]]).sort((a,b)=>b[1]-a[1]);
    $("#sob").innerHTML=`<div class="scs">${sc("Собівартість","🧾",money(raw),unk?"без "+unk+" поз. без ціни":"вся сировина","gd")}${sc("За одиницю","🏷️",money(out?raw/out:0),"вихід: "+out+" од.")}${sc("Загальний час","⏱️",fmtT(time),"усі етапи")}${sc("Етапів","🧬",Object.keys(cy).length,"від сировини до фіналу")}</div>
    <div class="sch" id="sch"><svg class="ln"></svg>${cols.map((c,k)=>`<div class="scol"><div class="sct">${k===0?"СИРОВИНА":k===mx?"РЕЗУЛЬТАТ":"ЕТАП "+k}</div>${c.map(card).join("")}</div>`).join("")}</div>
    <div class="card" style="margin-top:14px"><div class="ch"><h3>Структура собівартості</h3></div>${tot.map(([n,c])=>`<div class="cb"><span>${esc(n)}</span><span class="bar"><i style="width:${Math.round(c/(raw||1)*100)}%"></i></span><b class="gd">${money(c)}</b></div>`).join("")||'<p class="meta">Вкажіть ціни сировини — вони з\'являться тут.</p>'}</div>`;

    G.order.forEach(n=>{const x=G.rm[n];if(!x)return;Object.keys(x.ing).forEach(i=>{if(!el[i]||!el[n])return;
      const a=el[i].getBoundingClientRect(),c=el[n].getBoundingClientRect(),x1=a.right-b.left+sch.scrollLeft,y1=a.top+a.height/2-b.top+sch.scrollTop,x2=c.left-b.left+sch.scrollLeft,y2=c.top+c.height/2-b.top+sch.scrollTop,m=(x1+x2)/2;

/* розрахунок: кілька цілей → етапи, цикли, сировина (проміжні беруться зі складу) */
function compute(items){
  const rm=Object.fromEntries(REC().map(r=>[r.name,r])),L={},tg={};
  items.forEach(i=>tg[i.name]=(tg[i.name]||0)+i.qty);
  const lv=n=>{if(n in L)return L[n];L[n]=0;if(rm[n])L[n]=1+Math.max(0,...Object.keys(rm[n].ing).map(lv));return L[n]};
  Object.keys(tg).forEach(lv);
  const order=Object.keys(L).sort((a,b)=>L[b]-L[a]),need={...tg},cy={};
  order.forEach(n=>{const r=rm[n];if(!r)return;let q=need[n]||0;if(!(n in tg))q=Math.max(0,q-stock(n));if(q<=0)return;
    cy[n]=Math.ceil(q/r.yield);Object.entries(r.ing).forEach(([i,p])=>need[i]=(need[i]||0)+cy[n]*p)});
  return{rm,L,order,need,cy,tg}}

    catch(e){el.innerHTML=`<p class="meta">${esc(e.message)}</p>`}};
  v.oninput=e=>{const T=e.target;if(T.id==="pnm")PL.name=T.value;const i=T.closest(".pqi");if(i){PL.items[+i.dataset.i].qty=Math.max(1,parseInt(i.value)||1);out()}};
  v.onchange=async e=>{const i=e.target.closest(".pr");if(i&&await setPrice(i.dataset.n,i.value)){out();toast("Ціну збережено")}};
  v.onclick=async e=>{const T=e.target;
    if(T.closest("#pn")){PL={id:null,name:"",items:[]};$("#pnm").value="";items();out();return}
    if(T.closest("#padd")){const n=$("#prc").value,q=Math.max(1,parseInt($("#pqt").value)||1),x=PL.items.find(i=>i.name===n);if(!n)return;x?x.qty+=q:PL.items.push({name:n,qty:q});items();out();return}
    const rm=T.closest("[data-rm]");if(rm){PL.items.splice(+rm.dataset.rm,1);items();out();return}
    if(T.closest("#psave")){if(!PL.name.trim())return toast("Вкажіть назву плану","er");if(!PL.items.length)return toast("Додайте рецепти","er");
      try{const r=await api("plan.save",{id:PL.id,name:PL.name,items:PL.items});if(r?.id)PL.id=r.id;toast("План збережено");loadPlans()}catch(x){toast(x.message,"er")}return}
    if(T.closest("#pcp")){const c=compute(PL.items),l=c.order.filter(n=>!c.rm[n]&&c.need[n]>stock(n)).map(n=>n+" ×"+(c.need[n]-stock(n)));
      if(!l.length)return toast("Закупівля не потрібна — усе є на складі");
      return navigator.clipboard.writeText("Закупівля для плану «"+(PL.name||"без назви")+"»:\n"+l.join("\n")).then(()=>toast("Скопійовано")).catch(()=>toast("Не вдалося скопіювати","er"))}
    const b=T.closest("#psv [data-a]");if(b){const o=PLS.find(x=>x.id===b.dataset.id);if(!o)return;
      if(b.dataset.a==="open"){PL={id:o.id,name:o.name,items:o.items.map(x=>({...x}))};$("#pnm").value=PL.name;items();out();scrollTo(0,0)}
      else sure("Видалити план «"+o.name+"»?",async()=>{if(await act("plan.delete",{id:o.id})){if(PL.id===o.id)PL.id=null;loadPlans()}})}};
  items();out();loadPlans();
};

/* адмін-вкладка: що робить кожен аркуш БД */
TABS.sheets=b=>{page(b,"Таблиці бази даних","admin.sheetsInfo",{},d=>tbl([["name","Аркуш",o=>`<code>${esc(o.name)}</code>`],["desc","Призначення"],["rows","Записів",o=>o.rows<0?bdg("немає","er"):o.rows],["cols","Колонок"]],d)+`<p class="meta" style="margin-top:10px">Позначка «немає» — аркуш не створено: запустіть migrateV2 в Apps Script.</p>`,"")};
})();
/* ===== авторизація та сесія ===== */
async function showApp(){S.bp=loadRef();S.bp.then(prefetch);$("#login").classList.add("hide");$("#app").classList.remove("hide");buildNav();go(location.hash.slice(1)||"home");startPoll()}
function endSession(msg){sfx("sys");
  S.user=null;S.token=null;try{sessionStorage.removeItem("tk")}catch(e){}
  clearInterval(S.poll);$("#app").classList.add("hide");$("#login").classList.remove("hide");
  $("#lerr").textContent=msg||"Сесію завершено. Потрібно перепідключитися. Всі підтверджені дії збережені.";
}
function startPoll(){clearInterval(S.poll);if(!CONFIG.API_URL||S.preview)return;S.poll=setInterval(()=>{if(document.hidden||S.busy)return;const a=S.act;S.act=false;api("ping",{active:a}).then(r=>{if(r&&r.idleIn!=null){if(r.idleIn<60&&!S.warned){S.warned=1;toast("Сесія завершиться через "+r.idleIn+" с без активності","er")}else if(r.idleIn>=60)S.warned=0}}).catch(()=>{})},CONFIG.POLL_MS)}
async function login(){
  const b=$("#lbtn");$("#lerr").textContent="";
  if(!$("#lg").value||!$("#pw").value){$("#lerr").textContent="Введіть логін і пароль";return}
  b.disabled=true;b.innerHTML='<span class="spin"></span>Вхід…';
  try{const d=await api("login",{login:$("#lg").value,password:$("#pw").value});
    S.token=d.token;S.user=d.user;try{sessionStorage.setItem("tk",d.token)}catch(e){}$("#pw").value="";showApp()}
  catch(e){$("#lerr").textContent=e.message;const lb=document.querySelector(".lbox");lb.classList.remove("shake");void lb.offsetWidth;lb.classList.add("shake")}
  b.disabled=false;b.textContent="Увійти";
}

$("#lbtn").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login()};
if(!CONFIG.API_URL){$("#prev").classList.remove("hide");$("#prev").onclick=()=>{S.preview=true;S.user={name:"Режим перегляду",role:"admin"};showApp()}}
else if(S.token)api("me").then(u=>{if(!u)return;S.user=u;showApp()}).catch(()=>{});

["click","keydown","pointermove"].forEach(ev=>document.addEventListener(ev,()=>{S.act=true},{passive:true}));
</script>
