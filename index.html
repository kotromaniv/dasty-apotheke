<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптека Аннесбурга</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>

<section id="login">
  <div class="card lbox">
    <div class="logo" id="lgo"></div>
    <h1>Аптека Аннесбурга</h1>
    <p class="sub">Вхід до системи управління</p>
    <label for="lg">Логін</label><input id="lg" autocomplete="username">
    <label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="lbtn" style="width:100%;margin-top:16px">Увійти</button>
    <button class="btn ghost hide" id="prev" style="width:100%;margin-top:8px">Переглянути інтерфейс без сервера</button>
    <div class="err" id="lerr"></div>
  </div>
</section>

<div id="app" class="hide">
  <nav id="nav"><div class="brand">⚕️ Аптека Аннесбурга</div></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/orders.js"></script>

<script src="js/alerts.js"></script>

<script src="js/profile.js"></script>
<script src="js/admin.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
