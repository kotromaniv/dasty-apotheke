<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06111a">
<title>Аптека Аннесбурга</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ctext y='38' font-size='38'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06111a;--bg2:#0a1c2a;--card:rgba(14,36,52,.86);--card2:rgba(255,255,255,.045);--bd:rgba(130,200,225,.14);--tx:#eaf3f7;--mu:#8fa8b7;--ac:#f7b733;--ac2:#e39a0c;--acx:#2a1a00;--tl:#2fd9bb;--ok:#4ade80;--er:#fb7185;--wr:#fbbf24;--r:16px;--sw:248px;--hh:56px;--sh:0 14px 34px -22px rgba(0,0,0,.85);--rgb:47,217,187}
html[data-theme=newyear]{--bg:#081a30;--bg2:#0b2442;--card:rgba(13,34,62,.86);--bd:rgba(170,215,255,.18);--ac:#ffd166;--ac2:#f2a516;--tl:#8fe3ff;--rgb:143,227,255}
html[data-theme=halloween]{--bg:#120a0a;--bg2:#1d0f0a;--card:rgba(34,18,12,.88);--bd:rgba(255,138,31,.2);--ac:#ff8a1f;--ac2:#e0600a;--acx:#1a0a00;--tl:#b57cff;--tx:#fbefe2;--mu:#b9a392;--rgb:255,138,31}
html[data-theme=hp_classic]{--bg:#0b0c14;--bg2:#15111d;--card:rgba(26,20,34,.88);--bd:rgba(224,178,84,.22);--ac:#e0b254;--ac2:#b8862c;--tl:#9fb4ff;--tx:#f6efe0;--mu:#a99f8c;--rgb:224,178,84}
html[data-theme=hp_halloween]{--bg:#0b0710;--bg2:#160c1c;--card:rgba(30,16,36,.88);--bd:rgba(255,122,40,.22);--ac:#ff7a28;--ac2:#c94a0a;--acx:#1a0800;--tl:#a46bff;--tx:#f8ecdf;--mu:#ae9bb3;--rgb:164,107,255}
html[data-theme=hp_christmas]{--bg:#0a1410;--bg2:#10201a;--card:rgba(16,34,26,.88);--bd:rgba(255,215,130,.2);--ac:#f0c24b;--ac2:#c9922a;--tl:#ff6b7a;--tx:#f6f1e4;--mu:#9fb3a5;--rgb:240,194,75}
html.tx-warn{--ac:#ffd400;--ac2:#e6b800;--bd:rgba(255,212,0,.22)}
html.tx-crit{--ac:#ff4d5e;--ac2:#d62039;--acx:#fff;--tl:#ff8a7a;--bd:rgba(255,90,105,.26)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.5 "Onest","Segoe UI",system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 520px at 85% -6%,rgba(var(--rgb),.16),transparent 60%),linear-gradient(170deg,var(--bg2),var(--bg) 62%);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:700;line-height:1.2}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
::selection{background:rgba(var(--rgb),.35)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
scrollbar-width:thin
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#fxwrap{position:fixed;inset:0;z-index:0;pointer-events:none}
#fxwrap canvas{width:100%;height:100%;display:block}
.lite #fxwrap{display:none}

/* ===== каркас ===== */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);height:100dvh;transition:grid-template-columns .22s}
#app.mini{--sw:68px}
#side{display:flex;flex-direction:column;min-height:0;background:linear-gradient(185deg,rgba(14,40,60,.97),rgba(7,20,32,.97));border-right:1px solid var(--bd);z-index:30}
.brand{display:flex;align-items:center;gap:10px;height:var(--hh);padding:0 16px;flex:none;border-bottom:1px solid var(--bd);font-family:"Playfair Display",serif;font-size:17px;color:var(--ac);white-space:nowrap;overflow:hidden}
.brand svg{width:26px;flex:none;color:var(--tl)}
.brand span{overflow:hidden;text-overflow:ellipsis}
#nl{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px}
.ng{font-size:10.5px;letter-spacing:1.2px;color:#7f98a8;padding:14px 10px 4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nl a{position:relative;display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:12px;color:#d3e2ea;cursor:pointer;margin-bottom:2px;border:1px solid transparent;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s,color .15s}
#nl a i{font-style:normal;font-size:17px;width:22px;text-align:center;flex:none}
#nl a span{overflow:hidden;text-overflow:ellipsis}
#nl a:hover{background:rgba(255,255,255,.06)}
#nl a.on{color:var(--ac);border-color:rgba(var(--rgb),.0);background:linear-gradient(90deg,rgba(247,183,51,.16),rgba(247,183,51,.03));box-shadow:inset 3px 0 0 var(--ac)}
#nl a .bdgn{margin-left:auto;background:var(--er);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;font-weight:800;line-height:17px}
.mini .ng,.mini #nl a span,.mini .brand span,.mini .uc .un,.mini #nl a .bdgn,.mini .uc .ub{display:none}
.mini #nl a{justify-content:center;padding:10px 0}
.mini .brand{justify-content:center;padding:0}
/* блок користувача — у потоці, нічого не перекриває */
.uc{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--bd);background:rgba(0,0,0,.18)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd366,var(--ac2));color:var(--acx);font-weight:800;display:grid;place-items:center;flex:none;border:2px solid rgba(255,255,255,.2);font-size:13px}
.av.lg{width:84px;height:84px;font-size:28px}
.un{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.un b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.un small{color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub{display:flex;gap:2px}
.ib{background:none;border:0;color:var(--mu);padding:7px;border-radius:10px;display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.ib:hover{color:var(--ac);background:rgba(255,255,255,.07)}
.ib svg{width:19px;height:19px}
.ib.on{color:var(--ac);background:rgba(247,183,51,.14)}
.mini .uc{justify-content:center;padding:10px 4px}
#col{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh}
#top{flex:none;height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--bd);background:rgba(6,16,25,.88);backdrop-filter:blur(8px);position:relative;z-index:20}
#top .tt{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:16px;font-weight:700}
#top .tt span.ico{font-size:19px}
#top .tt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Playfair Display",serif}
#top .sbtn{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:11px;padding:6px 10px;color:var(--mu);font-size:12.5px;min-width:150px}
#top .sbtn:hover{border-color:var(--ac);color:var(--tx)}
#top .sbtn kbd{margin-left:auto;font:11px monospace;background:rgba(255,255,255,.08);border-radius:5px;padding:1px 5px}
#burger{display:none}
.bdot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:99px;background:var(--er);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
#strips{flex:none}
.strip{display:flex;gap:12px;align-items:center;justify-content:center;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;flex-wrap:wrap;text-align:center}
.strip.warn{background:linear-gradient(90deg,#ffd400,#ffb300);color:#1a1200}
.strip.crit{background:linear-gradient(90deg,#ff2d4a,#c4122d);color:#fff}
.strip.info{background:linear-gradient(90deg,rgba(47,217,187,.25),rgba(47,217,187,.1));color:var(--tx);border-bottom:1px solid var(--bd)}
.strip.urgent{background:linear-gradient(90deg,#ff2d4a,#c4122d);color:#fff}
.strip button{background:rgba(0,0,0,.2);border:0;color:inherit;border-radius:8px;padding:2px 9px;font-weight:700}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 40px;scroll-behavior:smooth}
#view.fx{animation:rise .3s both}
.foot{margin-top:30px;text-align:center;color:var(--mu);font-size:12px}

/* ===== компоненти ===== */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:24px;color:#f3fbf9}
.ph p{color:var(--mu);font-size:13px;margin-top:3px;max-width:680px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta{color:var(--mu);font-size:12.5px}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffd366,var(--ac2));color:var(--acx);border:0;border-radius:11px;padding:9px 16px;font-size:13px;font-weight:700;box-shadow:0 8px 22px -12px rgba(247,183,51,.9);transition:transform .15s,filter .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.g{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--bd);box-shadow:none;padding:7px 12px;font-weight:600}
.btn.g:hover{border-color:var(--ac)}
.btn.d{background:rgba(251,113,133,.14);color:var(--er);border:1px solid rgba(251,113,133,.35);box-shadow:none;padding:7px 12px}
.btn.s{padding:5px 10px;font-size:12px}
.btn.big{padding:11px 22px;font-size:14px}
.btn.full{width:100%}
html[data-theme] .btn:not(.g):not(.d){color:var(--acx)}
input,textarea,select{background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(247,183,51,.14)}
select option{background:#0d2133;color:#eaf3f7}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:auto}
input[type=range]{padding:0;accent-color:var(--ac)}
label{display:block;color:var(--mu);font-size:12.5px;margin:12px 0 5px}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;margin:12px 0;color:var(--tx);font-size:13.5px}
.sw input{display:none}
.sw i{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i::after{transform:translateX(18px);background:var(--acx)}
.card{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.055),rgba(255,255,255,0) 45%),var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card.hov{transition:transform .18s,border-color .18s,box-shadow .18s}
.card.hov:hover{transform:translateY(-2px);border-color:rgba(247,183,51,.5);box-shadow:0 0 22px rgba(247,183,51,.12)}
.card h3{font-size:16px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.sc{display:flex;flex-direction:column;gap:4px;padding:16px 18px;animation:rise .4s both}
.sc .sh{display:flex;justify-content:space-between;align-items:center;color:#c4d6df;font-size:13px}
.sc .ci{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:17px;font-style:normal;flex:none}
.sc b{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sc small{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.er{color:var(--er)}.wr{color:var(--wr)}.gd{color:var(--ac)}.tl{color:var(--tl)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{max-width:320px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-size:12.5px;transition:background .15s,border-color .15s;white-space:nowrap}
.chip:hover{border-color:var(--ac)}
.chip.on{background:linear-gradient(135deg,#ffd366,var(--ac2));color:var(--acx);border-color:transparent;font-weight:700}
.bdg{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:#c4d6df;white-space:nowrap}
.bdg.ok{background:rgba(74,222,128,.14);color:var(--ok)}.bdg.wr{background:rgba(251,191,36,.14);color:var(--wr)}.bdg.er{background:rgba(251,113,133,.14);color:var(--er)}.bdg.tl{background:rgba(47,217,187,.14);color:var(--tl)}.bdg.gd{background:rgba(247,183,51,.16);color:var(--ac)}.bdg.mu{color:var(--mu)}
.tw{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mu);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;position:sticky;top:0;background:rgba(10,26,38,.96)}
table.so th[data-k]{cursor:pointer;user-select:none}
table.so th[data-k]:hover{color:var(--ac)}
th.asc::after{content:" ▲"}th.desc::after{content:" ▼"}
tr:hover td{background:rgba(255,255,255,.03)}
tr[hidden]{display:none}
td.r,th.r{text-align:right}
td .ra{margin:0;flex-wrap:nowrap}
.ra{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.rw:last-child{border:0}
.rw b{font-size:13.5px}
.rw small{display:block;color:var(--mu);font-size:12px}
.rv{color:var(--ac);font-weight:800;white-space:nowrap}
.warn{background:rgba(251,113,133,.12);color:var(--er);padding:9px 13px;border-radius:11px;margin:10px 0;font-size:13px}
.note{background:rgba(247,183,51,.09);border:1px solid rgba(247,183,51,.3);color:var(--ac);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px}
.bar{display:block;height:8px;background:rgba(0,0,0,.4);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--ac));border-radius:9px;transition:width .6s}
.empty{text-align:center;color:var(--mu);padding:34px 14px}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.err{color:var(--er);min-height:20px;margin-top:8px;font-size:13px}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:shim 1.2s linear infinite;margin:12px 0}
code{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:7px;font-size:12px;color:var(--tl)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-left:8px}
.stp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stp input{width:100px;text-align:center}
.pq{width:92px;padding:6px 8px;text-align:right}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 96px 38px;gap:8px;margin-bottom:8px;align-items:center}
.lrow.p0{grid-template-columns:minmax(0,1fr) 84px 38px}
.thumb{height:76px;border-radius:12px;background:radial-gradient(circle at 30% 20%,hsl(var(--h) 55% 28%),hsl(var(--h) 55% 11%));color:hsl(var(--h) 80% 70%);display:grid;place-items:center;margin-bottom:6px}
.thumb svg{width:42px}
.rc{display:flex;flex-direction:column;gap:6px}
.rc h3{font-size:15px}
.ing{display:flex;justify-content:space-between;font-size:12.5px;padding:1px 0;gap:8px}
.ing.bad{color:var(--er)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(251,191,36,.15);color:var(--wr);align-self:flex-start}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.wel{font-size:30px;color:var(--ac);text-shadow:0 0 26px rgba(247,183,51,.22)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:190px}
.pp{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;width:30%}
.pp i{display:block;width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(247,183,51,.45),rgba(247,183,51,.06));margin-top:8px}
.pp span{font-size:26px}
.hbr{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:6px 0}
.hbr .bar{margin:0}
.chart{width:100%;display:block}
.chart line{stroke:rgba(255,255,255,.08)}.chart text{fill:#8fa8b7;font-size:10px}.chart .wd{font-weight:700;fill:#c4d6df}.chart .bv{fill:var(--ac);font-weight:700}
.pf{display:flex;gap:22px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.attn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.attn:hover{border-color:var(--ac)}
.attn i{font-style:normal;font-size:20px}
.attn.er{border-color:rgba(251,113,133,.4)}.attn.wr{border-color:rgba(251,191,36,.4)}
.attn div{flex:1;min-width:0}
.attn b{display:block;font-size:13.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--mu);white-space:nowrap;font-weight:600}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
.tabs button:hover{color:var(--tx)}
/* адмін-розмітка */
.adm{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
.asd{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.asd h4{font-size:10.5px;letter-spacing:1.1px;color:#7f98a8;margin:14px 8px 4px}
.asd h4:first-child{margin-top:0}
.asd button{display:flex;gap:9px;align-items:center;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:#cfe0e8;text-align:left;font-size:13.5px}
.asd button:hover{background:rgba(255,255,255,.06)}
.asd button.on{background:rgba(247,183,51,.12);color:var(--ac);border-color:rgba(247,183,51,.3)}
.asd button i{font-style:normal;width:20px;text-align:center}
.cms-g{margin-bottom:12px}
.cms-g>summary{cursor:pointer;padding:10px 4px;font-weight:700;color:var(--ac);list-style:none}
.cms-g>summary::before{content:"▸ "}
.cms-g[open]>summary::before{content:"▾ "}
.cms-r{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.cms-r small{color:var(--mu);font-size:11.5px;display:block}
.cms-r.ch input{border-color:var(--ac)}
/* режим редагування тексту на сайті */

/* ---------- стан ---------- */
const S = {

function toast(msg, type = "in", ms) {

}

/* ---------- опитування сервера (живі оновлення) ---------- */
let pollT = 0, polling = false, lastPoll = 0;
const DEP = { home: ["inv", "board", "item", "rec", "herb", "tax"], craft: ["inv", "rec", "item"], stock: ["inv", "item"], herbs: ["herb", "inv"], orders: ["ord", "inv"], tax: ["tax"] };
function schedulePoll() { clearTimeout(pollT); const s = (S.cfg.pollSeconds || 15) * (document.hidden ? 4 : 1); pollT = setTimeout(() => poll(false), s * 1000); }
async function poll(force) {

  polling = true; lastPoll = Date.now();
  try {
    const active = Date.now() - S.lastAct < (S.cfg.pollSeconds || 15) * 1000 + 2000;
    const r = await api("ping", { active }, { tries: 1 });
    S.idleWarn = r.idleIn != null && r.idleIn <= 60 && !active ? r.idleIn : null;
    const cvChanged = applySync(r.sync || {}, false);
    const changed = []; const ov = S.ver || {};
    Object.keys(r.ver || {}).forEach(k => { if (ov[k] !== r.ver[k]) changed.push(k); });
    if (r.me) {
      const pc = S.user.perms !== r.me.perms || S.user.skill !== r.me.skill || S.user.roleName !== r.me.roleName || S.user.name !== r.me.name;
      Object.assign(S.user, r.me); if (pc) { renderNav(); if (!visiblePages().some(p => p.id === S.page)) go("home"); }
    }
    if (cvChanged || changed.length) {
      const wasTax = changed.includes("tax");
      await loadBoot(true); S.ver = r.ver || S.ver;
      if (cvChanged) { renderNav(); }
      const dep = DEP[S.page] || [];
      if (cvChanged || changed.some(k => dep.includes(k)) || wasTax && S.page === "tax") softRender();

function sessionEnded(msg) {
  if (S.ended) return; S.ended = true; clearTimeout(pollT);
  const m = modal({
    title: "🔌 " + esc(T("sess.title")), sticky: true,
    body: `<p style="line-height:1.6">${esc(msg || T("sess.text"))}</p><label>${esc(T("login.login"))}</label><input id="rl" value="${esc(S.user ? S.user.login : "")}" autocomplete="username"><label>${esc(T("login.password"))}</label><input id="rp" type="password" autocomplete="current-password"><div class="err" id="re"></div>`,
    foot: `<button class="btn" id="rb">${esc(T("sess.btn"))}</button><button class="btn g" id="ro">${esc(T("sess.out"))}</button>`
  });
  const go1 = async () => {
    const b = m.q("#rb"); m.q("#re").textContent = "";
    const r = await run(b, () => api("login", { login: m.q("#rl").value, password: m.q("#rp").value }));
    if (!r.ok) { m.q("#re").textContent = r.err.message; m.shake(); return; }
    setToken(r.data.token, !!localStorage.getItem("tk")); S.user = r.data.user; S.ended = false; m.sticky = false; m.close();
    await loadBoot(true); renderNav(); render(true); schedulePoll();
  };
  m.q("#rb").onclick = go1; m.q("#rp").onkeydown = e => { if (e.key === "Enter") go1(); };
  m.q("#ro").onclick = () => { m.sticky = false; m.close(); doLogout(true); };
}

async function doLogout(silent) {
  if (!silent) { try { await api("logout", {}, { tries: 1 }); } catch (e) {} }

const recByProd = () => { const m = {}; S.recipes.forEach(r => { if (r.enabled && !r.na) m[r.name] = r; }); return m; };
function bom(targets) {
  const rp = recByProd(), inv = Object.assign({}, S.inv), crafts = {}, raw = {};
  function need(name, qty, root, d, stack) {
    const rec = rp[name];
    if (!root && rec && !stack.includes(name)) { const use = Math.min(inv[name] || 0, qty); inv[name] = (inv[name] || 0) - use; qty -= use; if (qty <= 0) return; }
    if (!rec || stack.includes(name)) { raw[name] = (raw[name] || 0) + qty; return; }
    const cy = Math.ceil(qty / rec.yield), c = crafts[name] || (crafts[name] = { rec, cy: 0, d: 0 });
    c.cy += cy; c.d = Math.max(c.d, d);
    const sur = cy * rec.yield - qty; if (sur > 0) inv[name] = (inv[name] || 0) + sur;
    Object.entries(rec.ing).forEach(([ing, q]) => need(ing, q * cy, false, d + 1, stack.concat(name)));
  }
  targets.forEach(t => need(t.name, t.qty, true, 0, []));
  const list = Object.values(crafts).sort((a, b) => b.d - a.d);
  const rawL = Object.entries(raw).map(([name, n]) => ({ name, need: n, have: S.inv[name] || 0, miss: Math.max(0, n - (S.inv[name] || 0)) })).sort((a, b) => b.miss - a.miss || a.name.localeCompare(b.name, "uk"));
  const skillBad = list.filter(c => (S.user.skill || 1) < c.rec.skill);
  return { crafts: list, raw: rawL, time: list.reduce((a, c) => a + c.cy * c.rec.time, 0), missing: rawL.filter(r => r.miss > 0), skillBad };
}

/* ---------- схема крафту ---------- */
function closeScheme() { const o = $(".sov"); if (o) o.remove(); }
function openScheme(name, cycles) {
  closeScheme();
  const rp = recByProd(), root = rp[name]; if (!root) return;
  const nodes = {}, edges = {};
  function explode(n, qty, depth, parent, stack) {
    const rec = rp[n], nd = nodes[n] || (nodes[n] = { name: n, need: 0, depth: 0, rec, cy: 0 });
    nd.need += qty; nd.depth = Math.max(nd.depth, depth);
    if (parent) { const k = n + ">" + parent; edges[k] = edges[k] || { from: n, to: parent, q: 0 }; edges[k].q += qty; }
    if (rec && !stack.includes(n)) { const cy = Math.ceil(qty / rec.yield); nd.cy += cy; Object.entries(rec.ing).forEach(([i, q]) => explode(i, q * cy, depth + 1, n, stack.concat(n))); }
  }
  explode(name, cycles * root.yield, 0, null, []);
  const maxD = Math.max(...Object.values(nodes).map(n => n.depth)), cols = Array.from({ length: maxD + 1 }, () => []);
  Object.values(nodes).forEach(n => cols[maxD - n.depth].push(n));
  const bomR = bom([{ name, qty: cycles * root.yield }]);
  const o = document.createElement("div"); o.className = "sov";
  const colTitle = (i) => i === maxD ? T("scheme.final") : (cols[i].every(n => !n.rec) ? T("scheme.raw") : T("scheme.mid"));
  o.innerHTML = `<div class="soh"><h3>🗺 ${esc(T("scheme.title"))}: ${esc(name)}</h3><label style="margin:0">${esc(T("scheme.cycles"))}</label><input type="number" id="scy" min="1" max="1000" value="${cycles}" style="width:90px"><span class="meta">⏱ ${fmtT(bomR.time)}</span><button class="btn g" data-act="schemeClose">✕ ${esc(T("scheme.close"))}</button></div>
  <div class="sob"><div class="sch" id="sch"><svg class="ln" id="sln"></svg>${cols.map((col, i) => `<div class="scol"><div class="sct">${esc(colTitle(i))}</div>${col.map(n => {
    const have = S.inv[n.name] || 0, ok = have >= n.need, cls = n.name === name ? "fin" : n.rec ? "mid" : "rw0";

/* послідовне виконання крафтів (проміжні → кінцевий) */
async function runPlanCrafts(b, btn, done) {
  const total = b.crafts.length; if (!total) return;
  const ok = await ask({ title: T("plan.runT"), text: T("plan.runQ", { n: total, time: fmtT(b.time) }), ok: T("plan.run") }); if (!ok) return;
  const html = btn.innerHTML; btn.disabled = true; let i = 0;
  try {
    for (const c of b.crafts) {
      i++; btn.innerHTML = `<i class="spin"></i>${i}/${total} ${esc(c.rec.name)}`;
      let left = c.cy; while (left > 0) { const n = Math.min(left, 1000); await api("craft", { recipeId: c.rec.id, cycles: n }); left -= n; }
    }
    toast(T("plan.runDone"), "ok"); SFX("done"); confetti();
  } catch (e) { toast(`${T("plan.runFail")} (${i}/${total}): ${e.message}`, "er", 9000); }
  btn.innerHTML = html; btn.disabled = false;
  try { await refreshSnap(); await loadBoot(true); } catch (e) {}
  if (done) done(); render(true);
}

function paintStatic() {
  $$("[data-tx]", $("#login")).forEach(el => { el.textContent = T(el.dataset.tx); });
  $("#lg_b").textContent = T("login.btn");
  $("#lgLogo").innerHTML = LOGO;
  $("#burger").innerHTML = ic("menu"); $("#collapse").innerHTML = ic("panel"); $("#bellB").innerHTML = ic("bell"); $("#musB").innerHTML = ic("music"); $("#editB").innerHTML = ic("edit");
  $("#uProf").innerHTML = ic("user"); $("#uOut").innerHTML = ic("logout"); $("#sbI").innerHTML = ic("search");
  $$("[data-tx]", $("#top")).forEach(el => { el.textContent = T(el.dataset.tx); });
}
async function showApp() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#app").classList.toggle("mini", !!store.get("mini", false));
  $("#editB").classList.toggle("hide", !isAdmin());
  renderNav(); renderStrips(); updateBell(); syncMusBtn();
  FX.set(S.sync.theme || "default"); AUDIO.theme(S.sync.theme || "default");
  S.ended = false; render(false); schedulePoll();
  if (PREF.music) { document.addEventListener("pointerdown", () => { if (PREF.music && !AUDIO.on) AUDIO.start(); }, { once: true, capture: true }); }
}
$("#lf").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("#lg_e"), b = $("#lg_b"); err.textContent = "";
  const r = await run(b, () => api("login", { login: $("#lg_l").value, password: $("#lg_p").value }));
  if (!r.ok) { err.textContent = r.err.message; $("#lf").classList.remove("shake"); void $("#lf").offsetWidth; $("#lf").classList.add("shake"); SFX("er"); return; }
  setToken(r.data.token, $("#lg_r").checked); S.user = r.data.user;
  try { await loadBoot(); } catch (x) { err.textContent = x.message; return; }
  $("#lg_p").value = ""; SFX("ok"); showApp();
});
(async function start() {
  paintStatic();
  FX.set("default");
  fetch("https://api.ipify.org?format=json").then(r => r.json()).then(j => { S.ip = j.ip || ""; }).catch(() => {});
  const tk = (() => { try { return localStorage.getItem("tk"); } catch (e) { return null; } })() || sess.get("tk");
  if (tk) {
    S.token = tk;
    try { const me = await api("me", {}, { quiet: true, tries: 2 }); S.user = me.user || me; await loadBoot(); await showApp(); return; }
    catch (e) { S.user = null; S.token = null; setToken(null); }
  }
  $("#login").classList.remove("hide"); $("#lg_l").focus();
})();
